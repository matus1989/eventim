<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex">
    <script type='text/javascript'>
        var cookieEnabled = navigator.cookieEnabled;
        if (!cookieEnabled) {
            document.cookie = 'cookietest=1';
            cookieEnabled = document.cookie.indexOf('cookietest=') != -1;
        }

        if(cookieEnabled){
            document.cookie = 'cookietest=1; expires=Thu, 01-Jan-1970 00:00:01 GMT';
            document.location.href = decodeURIComponent('%2F%3Fc%3Deventimlight%26e%3Dshopde%26t%3Dhttps%253A%252F%252Fwww.eventim-light.com%252Fde%252Fa%252F65488918b266253e892eaec1%252Fs%252F692425419d93a5650a708f21%26cid%3Dde-DE%26tsr%3D1700000000%26tsh%3D879d2d462f5416c9ed57e94c604a92988fc1bb912a4b386eac47aab51b3034cb');
        } else {
            setTimeout(function () {
                document.querySelector('.nocookies').classList.remove('hidden');
            }, 100);
        }
    </script>
    <style type="text/css">
        body {
            color: #000;
            font-family: Arial,Helvetica,sans-serif;
            font-size: 0.685rem;
        }

        .alert-error {
            background-color: #f2dede;
            border-color: #eed3d7;
        }

        .nojavascript, .nocookies {
            border: 1px solid red !important;
        }

        .alert {
            padding: 8px 35px 8px 21px;
            font-weight: normal;
            font-family: Arial,Helvetica,sans-serif;
            font-size: 0.875rem;
            -webkit-text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            border: 1px solid #fbeed5;
            -webkit-border-radius: 4px;
            -moz-border-radius: 4px;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <noscript>
        <div class="nojavascript alert alert-error">
            <p>Für diese Seite muss JavaScript aktiviert sein! Der Browser, den Sie verwenden, unterstützt JavaScript nicht oder JavaScript ist auf ihm ausgeschaltet. <br>Versuchen Sie es erneut mit einem Browser, auf dem JavaScript angeschaltet ist. <a href="https://www.enable-javascript.com/de/" target="_blank">Mehr erfahren</a></p>
        </div>
    </noscript>
    <div class="nocookies alert alert-error hidden">
        <p></p>
    </div>
</body>
</html>
