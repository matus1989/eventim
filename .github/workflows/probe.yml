# DIAGNOSTYKA: czy runner pobiera strone sklepu?
#
# Powstal jako bramka Fazy 0 i rozwiazal wtedy jedno pytanie: czy adres IP
# hostowanego runnera jest przyjmowany przez Akamai i Queue-it. Nie da sie
# tego rozstrzygnac na maszynie lokalnej - inny adres IP, inne warunki
# sieciowe. Bramka przeszla 2/2 (runy 37183741624 i 37184256979, dwa
# rozne adresy AS8075), wiec pytanie ma odpowiedz.
#
# Zostawiony na wypadek, gdyby monitoring kiedys przestal pobierac strone.
# To jedyna rzecz w repo, ktora potrafi rozroznic:
#   - Akamai usunelo wpis w bialej liscie User-Agentow (ADR-2, R3),
#   - zmienila sie struktura JSON-LD i parser przestal widziec terminy (R2),
#   - adres runnera trafil do zablokowanego zakresu (R1, architektura 2.5).
# Bez tego narzedzia taki stan wygladalby tylko jak cisza na Telegramie.
#
# Celowo TYLKO workflow_dispatch - nie odpala sie po pushu. Kazdy push
# odwalal 26 s CI, a blama push-triggered niczego nie mowi, czego nie
# powiedzialby watch.yml z Fazy 7.
#
# Bez sekretow. Celowo: diagnostyka nie moze zaleziec od konfiguracji
# Telegrama, bo wtedy nie odroznimy "nie da sie pobrac strony" od
# "nie ma tokenu".
#
# Metryka sukcesu (roadmap.md, Faza 0): hops == 5 ORAZ znaleziony wezel
# EventSeries z terminami.
#
# Uruchomienie: Actions -> ta diagnostyka -> Run workflow.
#
# Wynik: podsumowanie na gorze strony runa + artefakt z pobrana strona.
# Kod wyjscia 2 = bramka nie przeszla; artykul planu awaryjny: plan
# techniczny, sekcja 11.1.

name: Diagnostyka pobierania strony

on:
  workflow_dispatch:

# Bez sekretow, wiec tylko odczyt repozytorium - najmniejsze uprawnienia,
# jakie dzialaja.
permissions:
  contents: read

# Kolejne uruchomienia nie powinny sie nakladac: proba strzela do sklepu
# i dwa rownolegle handshake'i tylko zwiekszaja ryzyko wyzwania Queue-it.
concurrency:
  group: diagnostyka-pobierania
  cancel-in-progress: false

jobs:
  bramka:
    name: Pobierz strone sklepu
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testy jednostkowe (bez sieci)
        # Kolejnosc jest istotna: nie uruchamiamy proby na runnerze,
        # na ktorym testy nie przechodza. Czyli najpierw tani test
        # lokalny, potem jedno zapytanie do sklepu.
        run: python -m pytest -q -m "not live"

      - name: Srodowisko runnera
        # Wypisujemy wersje i architekture recznie: przy bledzie w probie
        # to jedyne dane, ktore zostaja w logu.
        run: |
          echo "runner:  $RUNNER_OS / $RUNNER_ARCH"
          echo "python:  $(python -VV)"
          echo "data:    $(date -u +%FT%TZ)"

      - name: Proba pobrania
        id: probe
        # continue-on-error: pozwala dojsc do kroku artefaktow, zeby
        # odpowiedz (strona marketingowa albo zmieniony JSON-LD) byla
        # do ogladania. Koniec pipeline'u oblezy ten krok nizej.
        continue-on-error: true
        env:
          # vars, nie secrets: URL sklepu nie jest sekretem, a jego zmiana
          # nie powinna wymagac rotacji sekretow (ryzyko R10).
          EVENTIM_TARGET_URL: ${{ vars.EVENTIM_TARGET_URL }}
        run: |
          python scripts/probe.py --pauza 8

      - name: Artefakty proby
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostyka-${{ github.run_number }}
          path: probe-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Werdykt
        # Ten krok decyduje o kolorze runa. Dopiero tutaj proba moze
        # "obliczyc" - inaczej czerwony run nie wskazywalby, czy zadzialal
        # skrypt, czy nie przeszla bramka.
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::Pobieranie nieudane. Wspolczesny monitoring na pewno tez nie pobiera strony - patrz podsumowanie runa i plan awaryjny (technical-plan.md 11.1)."
          exit 1