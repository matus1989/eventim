# CODZIENNY monitoring: sprawdza dostepnosc biletow co 10 minut.
#
# To jest wlasciwy monitoring. `probe.yml` jest diagnostyka - odpala sie
# recznie i nic nie wysyla. Kazdy push wywolujacy `probe.yml` bylby mierzony
# w minutach limitu crona, a blama push-triggered niczego nie mowi, czego nie
# powiedzialby ten plik.
#
# Piec rzeczy, ktore latwo skopiowac bez zastanowienia:
#
# 1. **Sekret tylko przez `secrets.*`.** `vars.*` nie chroni niczego, a GitHub
#    pokazuje ich wartosc w logu. `EVENTIM_TARGET_URL` idzie przez `vars.*`
#    tylko dlatego, ze nie jest sekretem i ma byc edytowalny bez rotacji
#    sekretow.
# 2. **Bez `pull_request`.** W PR-ach sekrety sa niedostepne, wiec taki trigger
#    czerwienilby sie na sekretach, ktorych tam z definicji nie ma. Testy na
#    pushu to osobny `ci.yml`, a nie godzina co godzine.
# 3. **`concurrency` bez `cancel-in-progress`.** Kanapujace sie sprawdzenia o nic
#    nie dobrego: alert o biletach i tak wyjdzie z tego, ktore skonczy sie
#    pierwsze, a drugie tylko zmarnuje limit crona.
# 4. **Cache cookies jest optymalizacja, nie poprawnosc.** Wywiektowany po 7
#    dniach cache oznacza zimne pobranie (piec hopow, ~1,2 s zamiast ~0,1 s) -
#    wynik identyczny. `tests/test_main.py::test_poprawnosc_nie_zalezy_od_cache`
#    pilnuje, zeby ta degradacja byla faktycznie bezpieczna.
# 5. **Kazda zmienna opcjonalna jest przekazana z `vars.*`.** Zmienna ustawiona
#    w repozytorium, ktorej workflow nie czyta, wyglada w dokumentacji jak
#    dzialajaca, a nie robi absolutnie nic - to najgorszy rodzaj cichej awarii.
#    `tests/test_workflow.py` bierze liste z `config.OPTIONAL_VARS`, wiec nowa
#    zmienna w kodzie bez odpowiednika w `watch.yml` wywala test, a nie runa
#    o trzy miesiace pozniej.
#
# Nieprzekazanie pustej zmiennej jest **bezpieczne** i to nie przypadek:
# GitHub podstawia `""`, a `Config.from_env()` traktuje `""` jako brak i bierze
# wartosc domyslna. Ten sam zapis obsluguje "nie ustawiono" i "wyczyszczono".
#
# `pytest -m "not live"` przed wlasciwym krokiem kosztuje ok. 25 s co 10 min
# (ok. 150 min/mies. z limitu ~2000). Jest celowe: zielony run mowi, ze
# checkout i instalacja sa sprawne, wiec codzienny check ma sensowny kod
# bazowy. Gdyby to przeszkadzalo w limicie crona - przeniesc do `ci.yml`
# na `push`, bo testy sprawdzaja nasz kod, a ten zmienia sie tylko przy
# zmianach w repozytorium.

name: Watch tickets

on:
  schedule:
    # Co 10 minut, nie "0 * * * *" ani "17 * * * *".
    # `*/10` rozklada obciazenie na GitHub Actions (brak szczytu o pełnej godzinie).
    # Cena: nieco wiecej runów, ale szybsza reakcja na dostepne bilety.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read # minimalne: job nie pisze nic do repozytorium

concurrency:
  group: ticket-watch
  cancel-in-progress: false # nie kasujemy trwajacego sprawdzenia

jobs:
  check:
    runs-on: ubuntu-latest
    # Wiszace zadanie HTTP marnuje budzet crona. Realnie wystarcza ~2 s;
    # 10 min to zapas na ciezki dzień, nie na czekanie w nieskonczonosc.
    timeout-minutes: 10

    # Zmienne opcjonalne to **zmienne** repozytorium
    # (Settings -> Variables), nie sekrety — zadna z nich nie jest tajemnicą.
    # Jedyna rzecz, która trafia tu spoza `vars.*`, to domyślna ścieżka pliku
    # stanu: `||` w wyrażeniu GitHuba to odpowiednik `?:` w Pythonie, więc
    # niezdefiniowana zmienna daje dokładnie ten sam napis co `Config.state_path`.
    env:
      EVENTIM_STATE_FILE: ${{ vars.EVENTIM_STATE_FILE || '.cache/eventim-state.json' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -e ".[dev]"

      # Zmiana w repozytorium nie moze wywolac alertu, dopoki nie przeszla
      # testow - mimo ze w tym pliku nie ma sekretow.
      - name: Testy jednostkowe (bez sieci)
        run: pytest -q -m "not live"

      # `.cache/eventim-state.json` trzyma cookies sesji Queue-it. Bez nich
      # kazde godzinne pobranie zaczyna od pieciohopowego handshake'u.
      # Katalog jest w `.gitignore`, wiec nigdy nie trafi do repozytorium.
      - name: Cache cookies sesji
        uses: actions/cache@v4
        with:
          # Sciezka cache to **ten sam** napis co plik stanu programu, a nie
          # wpisany na sztywno `.cache`. Rozdzielenie ich oznaczaloby, ze
          # wlasna `EVENTIM_STATE_FILE` po cichu omijalaby cache - i kazde
          # sprawdzenie wracaloby do pieciohopowego handshake'u bez powodu.
          path: ${{ env.EVENTIM_STATE_FILE }}
          # Klucz unikalny na przebieg: przy stalym kluczu GitHub zapisuje tylko
          # wtedy, gdy go nie bylo, a cookies zmieniaja sie po kazdym ruchu.
          key: eventim-state-${{ github.run_id }}
          restore-keys: eventim-state-

      # Brak sekretu konczy sie czytelnym `ConfigError` i kodem 1 - nie
      # `KeyError` z tracebackiem. Program zgłasza *komplet* braków naraz,
      # zeby nie poprawiać po jednym i nie marnować limitu crona.
      - name: Sprawdzenie dostepnosci
        env:
          EVENTIM_TARGET_URL: ${{ vars.EVENTIM_TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcjonalne — kazda z `config.OPTIONAL_VARS` plus poziom logow,
          # ktorego `Config` nie czyta (argparsuje `os.environ` sam).
          # Pusta wartosc = brak zmiennej = wartosc domyslna z `Config`.
          EVENTIM_USER_AGENT: ${{ vars.EVENTIM_USER_AGENT }}
          EVENTIM_TIMEOUT: ${{ vars.EVENTIM_TIMEOUT }}
          EVENTIM_MAX_HOPS: ${{ vars.EVENTIM_MAX_HOPS }}
          EVENTIM_ERROR_COOLDOWN_HOURS: ${{ vars.EVENTIM_ERROR_COOLDOWN_HOURS }}
          EVENTIM_LOG_LEVEL: ${{ vars.EVENTIM_LOG_LEVEL }}
          TELEGRAM_MAX_RETRIES: ${{ vars.TELEGRAM_MAX_RETRIES }}
          # `EVENTIM_STATE_FILE` jest ustawione wyzej, na poziomie zadania —
          # cache musi czytac dokladnie ten sam napis co program.
        # Kod wyjscia 1 tu nie jest bledem konfiguracji, tylko sygnałem:
        # "nie udało się sprawdzić" albo "nie udało się wysłać alertu".
        # Zielony run znaczy tylko tyle, że sprawdzenie się wykonało.
        run: python -m eventim_watcher
